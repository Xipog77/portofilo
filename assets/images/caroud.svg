<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-caroud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="aws-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-caroud)"/>
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="50" y1="50" x2="750" y2="50"/>
    <line x1="50" y1="150" x2="750" y2="150"/>
    <line x1="50" y1="250" x2="750" y2="250"/>
    <line x1="50" y1="350" x2="750" y2="350"/>
    <line x1="150" y1="50" x2="150" y2="400"/>
    <line x1="300" y1="50" x2="300" y2="400"/>
    <line x1="450" y1="50" x2="450" y2="400"/>
    <line x1="600" y1="50" x2="600" y2="400"/>
  </g>
  <!-- Caro Board Graphic -->
  <g transform="translate(70, 90)">
    <rect width="250" height="250" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="2" filter="url(#glow-c)"/>
    <path d="M83,0 V250 M166,0 V250 M0,83 H250 M0,166 H250" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
    <!-- X moves -->
    <path d="M26,26 L56,56 M56,26 L26,56" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow-c)"/>
    <path d="M109,109 L139,139 M139,109 L109,139" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" filter="url(#glow-c)"/>
    <!-- O moves -->
    <circle cx="124" cy="41" r="16" fill="none" stroke="#f43f5e" stroke-width="5" filter="url(#glow-c)"/>
    <circle cx="208" cy="124" r="16" fill="none" stroke="#f43f5e" stroke-width="5" filter="url(#glow-c)"/>
    <circle cx="41" cy="208" r="16" fill="none" stroke="#f43f5e" stroke-width="5" filter="url(#glow-c)"/>
  </g>
  <!-- Architecture Visual -->
  <g transform="translate(370, 75)">
    <rect width="360" height="280" rx="20" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.5"/>
    <rect x="25" y="25" width="110" height="30" rx="6" fill="url(#aws-grad)"/>
    <text x="80" y="45" fill="#111" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" text-anchor="middle">AWS CLOUD</text>
    <rect x="145" y="25" width="150" height="30" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1"/>
    <text x="220" y="45" fill="#38bdf8" font-family="Montserrat, sans-serif" font-weight="700" font-size="12" text-anchor="middle">MICROSERVICES</text>
    <!-- Nodes -->
    <g transform="translate(25, 75)">
      <rect x="0" y="0" width="145" height="50" rx="10" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="72" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Auth &amp; User Pod</text>
      <text x="72" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">JWT Security</text>

      <rect x="165" y="0" width="145" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="237" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Matchmaking Hub</text>
      <text x="237" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Realtime WebSocket</text>

      <rect x="82" y="75" width="145" height="50" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <text x="154" y="99" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Game Core Engine</text>
      <text x="154" y="115" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Distributed State</text>

      <path d="M72,50 L154,75 M237,50 L154,75" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4"/>
    </g>
    <text x="25" y="235" fill="#a5b4fc" font-family="sans-serif" font-size="12">High Availability • Scalable Architecture • Team Leader</text>
    <text x="25" y="255" fill="#64748b" font-family="sans-serif" font-size="11">Coursework @ UET Cloud Computing</text>
  </g>
  <text x="400" y="415" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="800" font-size="22" text-anchor="middle" letter-spacing="1.5">CAROUD : CLOUD-NATIVE CARO SYSTEM</text>
</svg>
