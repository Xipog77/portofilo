<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-caro" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </radialGradient>
    <linearGradient id="cyan-glow-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="rose-glow-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow-neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-caro)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="225" r="160" fill="#0284c7" opacity="0.18" filter="url(#glow-neon)"/>
  <circle cx="520" cy="225" r="160" fill="#e11d48" opacity="0.15" filter="url(#glow-neon)"/>

  <!-- Center Caro Game Board Card (Perfect Center) -->
  <g transform="translate(245, 70)">
    <!-- Board Base Outer Glow -->
    <rect x="0" y="0" width="310" height="310" rx="32" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2.5" filter="url(#glow-neon)"/>
    
    <!-- Grid Lines -->
    <g stroke="rgba(255, 255, 255, 0.14)" stroke-width="3.5" stroke-linecap="round">
      <line x1="103" y1="26" x2="103" y2="284"/>
      <line x1="207" y1="26" x2="207" y2="284"/>
      <line x1="26" y1="103" x2="284" y2="103"/>
      <line x1="26" y1="207" x2="284" y2="207"/>
    </g>

    <!-- Caro Pieces: X and O -->
    <!-- X 1 (Top-Left) -->
    <g transform="translate(51, 51)" filter="url(#glow-neon)">
      <line x1="-25" y1="-25" x2="25" y2="25" stroke="url(#cyan-glow-c)" stroke-width="9" stroke-linecap="round"/>
      <line x1="25" y1="-25" x2="-25" y2="25" stroke="url(#cyan-glow-c)" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- O 1 (Top-Center) -->
    <circle cx="155" cy="51" r="25" fill="none" stroke="url(#rose-glow-c)" stroke-width="8" filter="url(#glow-neon)"/>

    <!-- X 2 (Center) -->
    <g transform="translate(155, 155)" filter="url(#glow-neon)">
      <line x1="-30" y1="-30" x2="30" y2="30" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
      <line x1="30" y1="-30" x2="-30" y2="30" stroke="#38bdf8" stroke-width="10" stroke-linecap="round"/>
    </g>

    <!-- O 2 (Center-Right) -->
    <circle cx="259" cy="155" r="25" fill="none" stroke="url(#rose-glow-c)" stroke-width="8" filter="url(#glow-neon)"/>

    <!-- O 3 (Bottom-Left) -->
    <circle cx="51" cy="259" r="25" fill="none" stroke="url(#rose-glow-c)" stroke-width="8" filter="url(#glow-neon)"/>

    <!-- X 3 (Bottom-Right) - Winning Line Accent -->
    <g transform="translate(259, 259)" filter="url(#glow-neon)">
      <line x1="-25" y1="-25" x2="25" y2="25" stroke="url(#cyan-glow-c)" stroke-width="9" stroke-linecap="round"/>
      <line x1="25" y1="-25" x2="-25" y2="25" stroke="url(#cyan-glow-c)" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- Winning Streak Glow Line (Diagonal) -->
    <line x1="30" y1="30" x2="280" y2="280" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" opacity="0.65" stroke-dasharray="10,6" filter="url(#glow-neon)"/>
  </g>
</svg>
