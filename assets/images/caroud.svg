<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-caro" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a13"/>
    </radialGradient>
    <linearGradient id="cyan-glow-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="rose-glow-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="glow-neon" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-caro)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="280" cy="180" r="140" fill="#0284c7" opacity="0.15" filter="url(#glow-neon)"/>
  <circle cx="520" cy="220" r="140" fill="#e11d48" opacity="0.12" filter="url(#glow-neon)"/>

  <!-- Center Caro Game Board Card -->
  <g transform="translate(260, 60)">
    <!-- Board Base Outer Glow -->
    <rect x="0" y="0" width="280" height="280" rx="28" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="2" filter="url(#glow-neon)"/>
    
    <!-- Grid Lines -->
    <g stroke="rgba(255, 255, 255, 0.12)" stroke-width="3" stroke-linecap="round">
      <line x1="93" y1="24" x2="93" y2="256"/>
      <line x1="187" y1="24" x2="187" y2="256"/>
      <line x1="24" y1="93" x2="256" y2="93"/>
      <line x1="24" y1="187" x2="256" y2="187"/>
    </g>

    <!-- Caro Pieces: X and O -->
    <!-- X 1 (Top-Left) -->
    <g transform="translate(46, 46)" filter="url(#glow-neon)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="url(#cyan-glow-c)" stroke-width="8" stroke-linecap="round"/>
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="url(#cyan-glow-c)" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- O 1 (Top-Center) -->
    <circle cx="140" cy="46" r="22" fill="none" stroke="url(#rose-glow-c)" stroke-width="7" filter="url(#glow-neon)"/>

    <!-- X 2 (Center) -->
    <g transform="translate(140, 140)" filter="url(#glow-neon)">
      <line x1="-26" y1="-26" x2="26" y2="26" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/>
      <line x1="26" y1="-26" x2="-26" y2="26" stroke="#38bdf8" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- O 2 (Center-Right) -->
    <circle cx="234" cy="140" r="22" fill="none" stroke="url(#rose-glow-c)" stroke-width="7" filter="url(#glow-neon)"/>

    <!-- O 3 (Bottom-Left) -->
    <circle cx="46" cy="234" r="22" fill="none" stroke="url(#rose-glow-c)" stroke-width="7" filter="url(#glow-neon)"/>

    <!-- X 3 (Bottom-Right) - Winning Line Accent -->
    <g transform="translate(234, 234)" filter="url(#glow-neon)">
      <line x1="-22" y1="-22" x2="22" y2="22" stroke="url(#cyan-glow-c)" stroke-width="8" stroke-linecap="round"/>
      <line x1="22" y1="-22" x2="-22" y2="22" stroke="url(#cyan-glow-c)" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- Winning Streak Glow Line (Diagonal) -->
    <line x1="30" y1="30" x2="250" y2="250" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" opacity="0.6" stroke-dasharray="8,6" filter="url(#glow-neon)"/>
  </g>

  <!-- Title & Theme Badge -->
  <g transform="translate(400, 385)">
    <text x="0" y="0" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">CAROUD &#8226; CỜ CARO TRỰC TUYẾN</text>
    <text x="0" y="24" fill="#94a3b8" font-family="Poppins, sans-serif" font-weight="500" font-size="13" text-anchor="middle">Cloud-Native Microservices &#8226; Realtime WebSockets</text>
  </g>
</svg>
