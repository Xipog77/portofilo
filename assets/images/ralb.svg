<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-robot" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#241805"/>
      <stop offset="55%" stop-color="#0b121e"/>
      <stop offset="100%" stop-color="#03050a"/>
    </radialGradient>
    <linearGradient id="amber-glow-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cyan-glow-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="metal-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow-rob" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-robot)"/>

  <!-- Ambient Lighting Orbs -->
  <circle cx="340" cy="180" r="140" fill="#f59e0b" opacity="0.16" filter="url(#glow-rob)"/>
  <circle cx="500" cy="180" r="140" fill="#0284c7" opacity="0.14" filter="url(#glow-rob)"/>

  <!-- Technical Blueprint Grid Lines & HUD Ticks -->
  <g stroke="rgba(56, 189, 248, 0.15)" stroke-width="1.5">
    <circle cx="400" cy="180" r="130" fill="none" stroke-dasharray="6,8"/>
    <line x1="240" y1="180" x2="260" y2="180"/>
    <line x1="540" y1="180" x2="560" y2="180"/>
    <line x1="400" y1="40" x2="400" y2="60"/>
    <line x1="400" y1="300" x2="400" y2="320"/>
  </g>

  <!-- Iconic Articulated Industrial Robotic Arm -->
  <g transform="translate(400, 185)">
    <!-- Base Plate Platform Shadow / Glow -->
    <ellipse cx="-40" cy="115" rx="110" ry="20" fill="#f59e0b" opacity="0.25" filter="url(#glow-rob)"/>

    <!-- Heavy Industrial Base Pedestal -->
    <path d="M -110,115 L 30,115 L 20,80 L -100,80 Z" fill="url(#metal-dark)" stroke="url(#amber-glow-r)" stroke-width="2"/>
    <rect x="-90" y="70" width="100" height="12" rx="3" fill="#1e293b" stroke="#64748b" stroke-width="1"/>

    <!-- Shoulder Turret Joint (Axis 1) -->
    <circle cx="-40" cy="55" r="32" fill="#0f172a" stroke="url(#amber-glow-r)" stroke-width="3" filter="url(#glow-rob)"/>
    <circle cx="-40" cy="55" r="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="-40" cy="55" r="6" fill="#fbbf24"/>

    <!-- Lower Arm Segment (Boom Link from Shoulder to Elbow) -->
    <!-- From (-40, 55) angled up-right to (20, -35) -->
    <g>
      <!-- Structural Arm Beam -->
      <polygon points="-52,50 -28,60 12,-25 32,-35" fill="url(#metal-dark)" stroke="url(#cyan-glow-r)" stroke-width="2"/>
      <!-- Hydraulic Piston Cylinder Parallel -->
      <line x1="-30" y1="75" x2="10" y2="5" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      <line x1="-15" y1="45" x2="25" y2="-25" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Elbow Joint (Axis 2) -->
    <circle cx="22" cy="-30" r="26" fill="#0f172a" stroke="url(#amber-glow-r)" stroke-width="3" filter="url(#glow-rob)"/>
    <circle cx="22" cy="-30" r="13" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="22" cy="-30" r="5" fill="#38bdf8"/>

    <!-- Forearm Segment (From Elbow to Wrist) -->
    <!-- From (22, -30) extending forward-down to (110, -5) -->
    <g>
      <polygon points="18,-42 28,-18 102,8 114,-14" fill="url(#metal-dark)" stroke="url(#cyan-glow-r)" stroke-width="2"/>
      <!-- Internal Cable Loom / Hydraulic Hose -->
      <path d="M 0,-15 Q 50,0 95,-5" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4,4"/>
    </g>

    <!-- Wrist Articulation Joint (Axis 3) -->
    <circle cx="112" cy="-4" r="18" fill="#0f172a" stroke="url(#amber-glow-r)" stroke-width="2.5" filter="url(#glow-rob)"/>
    <circle cx="112" cy="-4" r="8" fill="#38bdf8"/>

    <!-- End-Effector / Precision Robotic Gripper Claws -->
    <!-- Tool Flange Mount -->
    <rect x="125" y="-14" width="16" height="20" rx="3" fill="#334155" stroke="#f59e0b" stroke-width="1.5"/>

    <!-- Top Gripper Finger -->
    <path d="M 141,-10 L 165,-18 L 180,-6 L 168,-2 L 141,-6 Z" fill="url(#metal-dark)" stroke="url(#cyan-glow-r)" stroke-width="2" filter="url(#glow-rob)"/>
    <!-- Bottom Gripper Finger -->
    <path d="M 141,6 L 165,14 L 180,2 L 168,-2 L 141,2 Z" fill="url(#metal-dark)" stroke="url(#cyan-glow-r)" stroke-width="2" filter="url(#glow-rob)"/>

    <!-- Manipulated Glowing Laser Hologram / Micro-Component -->
    <g transform="translate(186, -2)" filter="url(#glow-rob)">
      <!-- Precision Laser Spark / Laser Dot -->
      <circle cx="0" cy="0" r="6" fill="#ef4444"/>
      <circle cx="0" cy="0" r="2" fill="#ffffff"/>
      <!-- Spark Rays -->
      <line x1="-12" y1="0" x2="12" y2="0" stroke="#ef4444" stroke-width="2"/>
      <line x1="0" y1="-12" x2="0" y2="12" stroke="#ef4444" stroke-width="2"/>
    </g>

    <!-- Robotic Laser Targeting Beam -->
    <line x1="135" y1="-4" x2="182" y2="-2" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.8"/>
  </g>

  <!-- Title & Theme Badge -->
  <g transform="translate(400, 385)">
    <text x="0" y="0" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">RALB &#8226; ROBOTIC ARM &amp; TỰ ĐỘNG HÓA</text>
    <text x="0" y="24" fill="#94a3b8" font-family="Poppins, sans-serif" font-weight="500" font-size="13" text-anchor="middle">Robotic Control &#8226; Embedded Firmware &#8226; SATLab UET Research</text>
  </g>
</svg>
