<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-ralb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="orange-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-o" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-ralb)"/>
  <line x1="50" y1="270" x2="750" y2="270" stroke="#3f3f46" stroke-width="16" stroke-linecap="round"/>
  <line x1="50" y1="270" x2="750" y2="270" stroke="#fbbf24" stroke-width="2" stroke-dasharray="20,20"/>
  <!-- Workstations -->
  <g transform="translate(80, 150)">
    <rect width="180" height="100" rx="12" fill="#27272a" stroke="#f97316" stroke-width="2" filter="url(#glow-o)"/>
    <text x="90" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Workstation 1</text>
    <text x="90" y="62" fill="#fbbf24" font-family="sans-serif" font-size="12" text-anchor="middle">Robot Arm Alpha</text>
    <text x="90" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="10" text-anchor="middle">Load: 88% (Balanced)</text>
  </g>
  <g transform="translate(310, 150)">
    <rect width="180" height="100" rx="12" fill="#27272a" stroke="#38bdf8" stroke-width="2"/>
    <text x="90" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Workstation 2</text>
    <text x="90" y="62" fill="#38bdf8" font-family="sans-serif" font-size="12" text-anchor="middle">Welding Robot Beta</text>
    <text x="90" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="10" text-anchor="middle">Load: 92% (Balanced)</text>
  </g>
  <g transform="translate(540, 150)">
    <rect width="180" height="100" rx="12" fill="#27272a" stroke="#10b981" stroke-width="2"/>
    <text x="90" y="38" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Workstation 3</text>
    <text x="90" y="62" fill="#10b981" font-family="sans-serif" font-size="12" text-anchor="middle">Assembly Unit Gamma</text>
    <text x="90" y="82" fill="#a1a1aa" font-family="sans-serif" font-size="10" text-anchor="middle">Load: 85% (Balanced)</text>
  </g>
  <!-- Header Card -->
  <g transform="translate(150, 45)">
    <rect width="500" height="70" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#f97316" stroke-width="1.5"/>
    <text x="250" y="30" fill="#fff" font-family="Montserrat, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">ROBOTIC ASSEMBLY LINE BALANCING (RALB)</text>
    <text x="250" y="52" fill="#fed7aa" font-family="sans-serif" font-size="12" text-anchor="middle">SAT-Driven Optimization • Combinatorial Constraints Solver</text>
  </g>
  <text x="400" y="415" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="800" font-size="22" text-anchor="middle" letter-spacing="1.2">RALB : SAT-DRIVEN ROBOTIC LINE BALANCING</text>
</svg>
