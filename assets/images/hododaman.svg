<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-hodo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1810"/>
      <stop offset="100%" stop-color="#180e0a"/>
    </linearGradient>
    <linearGradient id="gold-tree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-hodo)"/>
  <!-- Badges -->
  <g transform="translate(60, 35)">
    <rect width="210" height="32" rx="8" fill="url(#crimson)"/>
    <text x="105" y="21" fill="#fef3c7" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" text-anchor="middle">HỌ ĐỖ ĐÀM AN (NAM ĐỊNH)</text>
    <rect x="280" y="0" width="160" height="32" rx="8" fill="url(#gold-tree)"/>
    <text x="360" y="21" fill="#111" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" text-anchor="middle">REACT 19 TANSTACK</text>
    <rect x="450" y="0" width="150" height="32" rx="8" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1"/>
    <text x="525" y="21" fill="#fbbf24" font-family="Montserrat, sans-serif" font-weight="700" font-size="12" text-anchor="middle">TỘC PHẢ 9+ ĐỜI</text>
  </g>
  <!-- Tree Lineage Visual -->
  <g transform="translate(60, 90)">
    <rect width="680" height="230" rx="14" fill="#382319" stroke="#d97706" stroke-width="1.5"/>
    <text x="25" y="32" fill="#fde68a" font-family="Montserrat, sans-serif" font-size="13" font-weight="bold">SƠ ĐỒ TỘC PHẢ TƯƠNG TÁC (REACT FLOW &amp; DAGRE.JS)</text>
    <!-- Root Ancestor Node (Đời 1) -->
    <g transform="translate(270, 50)">
      <rect width="140" height="42" rx="8" fill="#7f1d1d" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="70" y="22" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Thủy Tổ Khởi Thủy</text>
      <text x="70" y="36" fill="#fde68a" font-family="sans-serif" font-size="9" text-anchor="middle">Đời 1 • Đỗ Tộc Đàm An</text>
    </g>
    <!-- Connecting Lines -->
    <line x1="340" y1="92" x2="340" y2="115" stroke="#f59e0b" stroke-width="2"/>
    <line x1="160" y1="115" x2="520" y2="115" stroke="#f59e0b" stroke-width="2"/>
    <line x1="160" y1="115" x2="160" y2="135" stroke="#f59e0b" stroke-width="2"/>
    <line x1="340" y1="115" x2="340" y2="135" stroke="#f59e0b" stroke-width="2"/>
    <line x1="520" y1="115" x2="520" y2="135" stroke="#f59e0b" stroke-width="2"/>
    <!-- Generation 2 Nodes -->
    <g transform="translate(90, 135)">
      <rect width="140" height="40" rx="6" fill="#451a03" stroke="#b45309"/>
      <text x="70" y="22" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Chi Trưởng (Đời 2)</text>
      <text x="70" y="34" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Nhánh Trưởng</text>
    </g>
    <g transform="translate(270, 135)">
      <rect width="140" height="40" rx="6" fill="#451a03" stroke="#b45309"/>
      <text x="70" y="22" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Chi Thứ Hai (Đời 2)</text>
      <text x="70" y="34" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Nhánh Thứ</text>
    </g>
    <g transform="translate(450, 135)">
      <rect width="140" height="40" rx="6" fill="#451a03" stroke="#b45309"/>
      <text x="70" y="22" fill="#fff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Chi Thứ Ba (Đời 2)</text>
      <text x="70" y="34" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Nhánh Thứ</text>
    </g>
    <!-- Line down to current -->
    <line x1="340" y1="175" x2="340" y2="195" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="340" y="215" fill="#fde68a" font-family="sans-serif" font-size="11" text-anchor="middle">Hỗ trợ hiển thị mở rộng / thu gọn đệ quy lên tới 9+ đời con cháu</text>
  </g>
  <g transform="translate(60, 340)">
    <rect width="680" height="42" rx="8" fill="rgba(24, 14, 10, 0.9)" stroke="#78350f"/>
    <text x="20" y="26" fill="#fed7aa" font-family="sans-serif" font-size="12">Lịch Âm Dương Song Song • Quỹ Họ Minh Bạch • Bức Tường Ký Ức (Memory Wall) • Drizzle ORM PostgreSQL</text>
  </g>
  <text x="400" y="420" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="800" font-size="18" text-anchor="middle" letter-spacing="1">HỌ ĐỖ ĐÀM AN — NỀN TẢNG QUẢN LÝ THÔNG TIN DÒNG HỌ HIỆN ĐẠI</text>
</svg>
