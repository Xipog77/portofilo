<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-tree" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0e2a1b"/>
      <stop offset="55%" stop-color="#071710"/>
      <stop offset="100%" stop-color="#020805"/>
    </radialGradient>
    <linearGradient id="gold-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="jade-tree" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="trunk-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="glow-tree" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-tree)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="400" cy="210" r="180" fill="#10b981" opacity="0.18" filter="url(#glow-tree)"/>
  <circle cx="400" cy="170" r="140" fill="#f59e0b" opacity="0.16" filter="url(#glow-tree)"/>

  <!-- The Grand Heritage Family Tree Icon (Centered & Scaled) -->
  <g transform="translate(400, 225) scale(1.18)">
    <!-- Base Circular Sacred Mandala Ring -->
    <circle cx="0" cy="0" r="135" fill="none" stroke="rgba(251, 191, 36, 0.2)" stroke-width="1.5" stroke-dasharray="4,6"/>
    <circle cx="0" cy="0" r="148" fill="none" stroke="rgba(52, 211, 153, 0.15)" stroke-width="1"/>

    <!-- Tree Roots (Deep Lineage Grounding) -->
    <g stroke="url(#trunk-grad)" stroke-width="4" stroke-linecap="round" opacity="0.85">
      <path d="M -8,75 Q -30,95 -65,115"/>
      <path d="M -4,75 Q -15,100 -25,125"/>
      <path d="M 0,75 Q 0,105 0,130"/>
      <path d="M 4,75 Q 15,100 25,125"/>
      <path d="M 8,75 Q 30,95 65,115"/>
      <path d="M -20,85 Q -45,100 -75,105" stroke-width="2.5"/>
      <path d="M 20,85 Q 45,100 75,105" stroke-width="2.5"/>
    </g>

    <!-- Tree Trunk (Solid, Majestic) -->
    <path d="M -22,80 C -18,40 -26,10 -12,-20 C -6,-35 -3,-50 0,-65 C 3,-50 6,-35 12,-20 C 26,10 18,40 22,80 Z" 
          fill="url(#trunk-grad)" stroke="#f59e0b" stroke-width="1.5" filter="url(#glow-tree)"/>

    <!-- Branches Spreading Upward & Outward -->
    <g stroke="url(#jade-tree)" stroke-linecap="round" fill="none">
      <!-- Main Primary Branches -->
      <path d="M 0,-65 C -25,-85 -70,-90 -95,-80" stroke-width="5"/>
      <path d="M 0,-65 C 25,-85 70,-90 95,-80" stroke-width="5"/>
      <path d="M 0,-65 C -10,-100 -20,-120 0,-135" stroke-width="5"/>
      <path d="M -12,-20 C -45,-30 -85,-25 -115,-15" stroke-width="4"/>
      <path d="M 12,-20 C 45,-30 85,-25 115,-15" stroke-width="4"/>
      
      <!-- Sub Branches -->
      <path d="M -60,-85 C -85,-110 -115,-105 -125,-90" stroke-width="3"/>
      <path d="M 60,-85 C 85,-110 115,-105 125,-90" stroke-width="3"/>
      <path d="M -30,-95 C -45,-125 -65,-130 -80,-130" stroke-width="2.5"/>
      <path d="M 30,-95 C 45,-125 65,-130 80,-130" stroke-width="2.5"/>
      <path d="M -70,-22 C -95,-45 -110,-40 -120,-35" stroke-width="2"/>
      <path d="M 70,-22 C 95,-45 110,-40 120,-35" stroke-width="2"/>
    </g>

    <!-- Foliage / Leaf Clusters (Stylized Jade & Gold Clouds) -->
    <g fill="#059669" opacity="0.35" filter="url(#glow-tree)">
      <circle cx="0" cy="-135" r="28"/>
      <circle cx="-95" cy="-80" r="24"/>
      <circle cx="95" cy="-80" r="24"/>
      <circle cx="-125" cy="-90" r="20"/>
      <circle cx="125" cy="-90" r="20"/>
      <circle cx="-115" cy="-15" r="22"/>
      <circle cx="115" cy="-15" r="22"/>
      <circle cx="-80" cy="-130" r="18"/>
      <circle cx="80" cy="-130" r="18"/>
    </g>

    <!-- Lineage Generational Nodes (Family Tree Hierarchy) -->
    <!-- Ancestor Top Node -->
    <g transform="translate(0, -135)" filter="url(#glow-tree)">
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="url(#gold-leaf)" stroke-width="3"/>
      <circle cx="0" cy="0" r="6" fill="#fde047"/>
    </g>

    <!-- Generation 2 Nodes -->
    <g transform="translate(-95, -80)" filter="url(#glow-tree)">
      <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="url(#gold-leaf)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="5" fill="#34d399"/>
    </g>
    <g transform="translate(95, -80)" filter="url(#glow-tree)">
      <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="url(#gold-leaf)" stroke-width="2.5"/>
      <circle cx="0" cy="0" r="5" fill="#34d399"/>
    </g>

    <!-- Generation 3 Nodes -->
    <g transform="translate(-125, -90)" filter="url(#glow-tree)">
      <circle cx="0" cy="0" r="9" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#fde047"/>
    </g>
    <g transform="translate(-80, -130)" filter="url(#glow-tree)">
      <circle cx="0" cy="0" r="9" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#fde047"/>
    </g>
    <g transform="translate(80, -130)" filter="url(#glow-tree)">
      <circle cx="0" cy="0" r="9" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#fde047"/>
    </g>
    <g transform="translate(125, -90)" filter="url(#glow-tree)">
      <circle cx="0" cy="0" r="9" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#fde047"/>
    </g>

    <!-- Generation 4 Lower Nodes -->
    <g transform="translate(-115, -15)" filter="url(#glow-tree)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#fde047"/>
    </g>
    <g transform="translate(115, -15)" filter="url(#glow-tree)">
      <circle cx="0" cy="0" r="10" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
      <circle cx="0" cy="0" r="4" fill="#fde047"/>
    </g>

    <!-- Golden Lineage Seed Sparkles -->
    <g fill="#fde047" opacity="0.9" filter="url(#glow-tree)">
      <circle cx="-45" cy="-60" r="3"/>
      <circle cx="45" cy="-60" r="3"/>
      <circle cx="-25" cy="-115" r="2.5"/>
      <circle cx="25" cy="-115" r="2.5"/>
      <circle cx="-100" cy="-45" r="2"/>
      <circle cx="100" cy="-45" r="2"/>
    </g>
  </g>
</svg>
