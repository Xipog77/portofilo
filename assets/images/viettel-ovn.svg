<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-viettel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="vt-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ee0033"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-v" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-viettel)"/>
  <!-- Viettel Networks Badge -->
  <g transform="translate(60, 40)">
    <rect width="170" height="34" rx="8" fill="url(#vt-red)"/>
    <text x="85" y="22" fill="#ffffff" font-family="Montserrat, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="1">VIETTEL NETWORKS</text>
    <rect x="180" y="0" width="220" height="34" rx="8" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
    <text x="290" y="22" fill="#38bdf8" font-family="Montserrat, sans-serif" font-weight="700" font-size="12" text-anchor="middle">OPENSTACK OVN MONITOR</text>
  </g>
  <!-- Architecture Diagram -->
  <g transform="translate(60, 95)">
    <!-- OVN Layer Box -->
    <rect width="320" height="230" rx="14" fill="#0f172a" stroke="#ee0033" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f87171" font-family="Montserrat, sans-serif" font-size="13" font-weight="bold">OVN &amp; LINUX KERNEL DATAPATH</text>
    <rect x="20" y="50" width="130" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="85" y="75" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle">OVSDB (TCP 6642)</text>
    <rect x="170" y="50" width="130" height="40" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="235" y="75" fill="#f8fafc" font-family="sans-serif" font-size="11" text-anchor="middle">Service_Monitor</text>
    <rect x="20" y="105" width="280" height="42" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-dasharray="4,4"/>
    <text x="160" y="131" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Custom ovn-octavia-lb-exporter</text>
    <rect x="20" y="160" width="130" height="45" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="85" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Linux Conntrack</text>
    <text x="85" y="196" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">ct_lb Bashing</text>
    <rect x="170" y="160" width="130" height="45" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="235" y="182" fill="#cbd5e1" font-family="sans-serif" font-size="10" text-anchor="middle">Sync Lag Calc</text>
    <text x="235" y="196" fill="#f59e0b" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">NB vs SB DB</text>
  </g>
  <!-- Observability Pipeline -->
  <g transform="translate(420, 95)">
    <rect width="320" height="230" rx="14" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow-v)"/>
    <text x="20" y="32" fill="#38bdf8" font-family="Montserrat, sans-serif" font-size="13" font-weight="bold">HYBRID OBSERVABILITY PIPELINE</text>
    <!-- vmagent -->
    <rect x="20" y="55" width="280" height="38" rx="8" fill="#1e293b" stroke="#3b82f6"/>
    <text x="160" y="79" fill="#93c5fd" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">vmagent (Edge Push + WAL Buffer)</text>
    <!-- VictoriaMetrics -->
    <rect x="20" y="105" width="280" height="38" rx="8" fill="#1e293b" stroke="#6366f1"/>
    <text x="160" y="129" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">VictoriaMetrics TSDB (Port 8428)</text>
    <!-- Alertmanager & Grafana -->
    <rect x="20" y="155" width="130" height="50" rx="8" fill="#1e293b" stroke="#ef4444"/>
    <text x="85" y="178" fill="#fca5a5" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Alertmanager</text>
    <text x="85" y="194" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">Telegram NOC &lt; 8s</text>
    <rect x="170" y="155" width="130" height="50" rx="8" fill="#1e293b" stroke="#f59e0b"/>
    <text x="235" y="178" fill="#fcd34d" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Grafana Dashboard</text>
    <text x="235" y="194" fill="#cbd5e1" font-family="sans-serif" font-size="9" text-anchor="middle">3-Tier Observability</text>
  </g>
  <!-- Performance stats -->
  <g transform="translate(60, 345)">
    <rect width="680" height="40" rx="8" fill="rgba(15, 23, 42, 0.8)" stroke="#334155"/>
    <text x="20" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">Phụ tải CPU: <tspan fill="#10b981" font-weight="bold">≤ 1.2%</tspan> | Tiêu hao RAM: <tspan fill="#10b981" font-weight="bold">≈ 55MB</tspan> | Phát hiện lỗi: <tspan fill="#38bdf8" font-weight="bold">2.4s</tspan> | Hội tụ cảnh báo NOC: <tspan fill="#f59e0b" font-weight="bold">&lt; 8s</tspan></text>
  </g>
  <text x="400" y="425" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="800" font-size="18" text-anchor="middle" letter-spacing="1">GIẢI PHÁP GIÁM SÁT HẠ TẦNG MẠNG OVN &amp; LOAD BALANCER OPENSTACK</text>
</svg>
