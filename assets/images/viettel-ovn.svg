<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-server" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#260912"/>
      <stop offset="55%" stop-color="#0b1222"/>
      <stop offset="100%" stop-color="#03060d"/>
    </radialGradient>
    <linearGradient id="rack-frame" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="blade-face" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="30%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="viettel-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3366"/>
      <stop offset="100%" stop-color="#cc0029"/>
    </linearGradient>
    <linearGradient id="net-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow-serv" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-server)"/>

  <!-- Ambient Datacenter Glow -->
  <circle cx="280" cy="180" r="140" fill="#ee0033" opacity="0.16" filter="url(#glow-serv)"/>
  <circle cx="520" cy="180" r="140" fill="#0284c7" opacity="0.16" filter="url(#glow-serv)"/>

  <!-- SDN / OVN Network Overlay Lines -->
  <g stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" stroke-dasharray="4,6">
    <line x1="120" y1="180" x2="250" y2="180"/>
    <line x1="550" y1="180" x2="680" y2="180"/>
    <circle cx="120" cy="180" r="4" fill="#38bdf8"/>
    <circle cx="680" cy="180" r="4" fill="#38bdf8"/>
  </g>

  <!-- Central Enterprise Server Rack Icon -->
  <g transform="translate(400, 185)">
    <!-- Base Plate Shadow & Aura -->
    <ellipse cx="0" cy="118" rx="160" ry="22" fill="#ee0033" opacity="0.22" filter="url(#glow-serv)"/>

    <!-- Outer Rack Cabinet Frame -->
    <rect x="-140" y="-125" width="280" height="235" rx="14" fill="url(#rack-frame)" stroke="#475569" stroke-width="3"/>
    <!-- Neon Corner Accent Rails -->
    <path d="M -135,-120 H -110 M -135,-120 V -95" stroke="url(#viettel-red)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 135,-120 H 110 M 135,-120 V -95" stroke="url(#viettel-red)" stroke-width="3" stroke-linecap="round"/>
    <path d="M -135,105 H -110 M -135,105 V 80" stroke="url(#net-cyan)" stroke-width="3" stroke-linecap="round"/>
    <path d="M 135,105 H 110 M 135,105 V 80" stroke="url(#net-cyan)" stroke-width="3" stroke-linecap="round"/>

    <!-- SERVER BLADE 1 (Top: Management Node / Cloud Controller) -->
    <g transform="translate(-120, -108)">
      <rect x="0" y="0" width="240" height="42" rx="6" fill="url(#blade-face)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <!-- Viettel Node Badge -->
      <rect x="10" y="10" width="22" height="22" rx="4" fill="#ee0033"/>
      <text x="21" y="25" fill="#ffffff" font-family="Montserrat, sans-serif" font-weight="900" font-size="9" text-anchor="middle">V</text>
      <!-- Drive Bay Slots -->
      <g fill="#0f172a" stroke="#334155" stroke-width="1">
        <rect x="42" y="10" width="28" height="22" rx="2"/>
        <rect x="74" y="10" width="28" height="22" rx="2"/>
        <rect x="106" y="10" width="28" height="22" rx="2"/>
        <rect x="138" y="10" width="28" height="22" rx="2"/>
      </g>
      <!-- Drive Activity LEDs -->
      <circle cx="64" cy="21" r="2.5" fill="#10b981" filter="url(#glow-serv)"/>
      <circle cx="96" cy="21" r="2.5" fill="#10b981" filter="url(#glow-serv)"/>
      <circle cx="128" cy="21" r="2.5" fill="#38bdf8" filter="url(#glow-serv)"/>
      <circle cx="160" cy="21" r="2.5" fill="#10b981" filter="url(#glow-serv)"/>
      <!-- Status Console LEDs & Ports -->
      <circle cx="185" cy="21" r="3" fill="#ee0033" filter="url(#glow-serv)"/>
      <circle cx="198" cy="21" r="3" fill="#38bdf8" filter="url(#glow-serv)"/>
      <rect x="210" y="14" width="18" height="14" rx="2" fill="#090d16" stroke="#64748b" stroke-width="1"/>
    </g>

    <!-- SERVER BLADE 2 (Middle: Compute Node 01 / OVN Chassis) -->
    <g transform="translate(-120, -56)">
      <rect x="0" y="0" width="240" height="42" rx="6" fill="url(#blade-face)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <!-- Cloud Node Badge -->
      <rect x="10" y="10" width="22" height="22" rx="4" fill="#0284c7"/>
      <text x="21" y="25" fill="#ffffff" font-family="Montserrat, sans-serif" font-weight="900" font-size="9" text-anchor="middle">C1</text>
      <!-- Drive Bay Slots -->
      <g fill="#0f172a" stroke="#334155" stroke-width="1">
        <rect x="42" y="10" width="28" height="22" rx="2"/>
        <rect x="74" y="10" width="28" height="22" rx="2"/>
        <rect x="106" y="10" width="28" height="22" rx="2"/>
        <rect x="138" y="10" width="28" height="22" rx="2"/>
      </g>
      <circle cx="64" cy="21" r="2.5" fill="#10b981" filter="url(#glow-serv)"/>
      <circle cx="96" cy="21" r="2.5" fill="#38bdf8" filter="url(#glow-serv)"/>
      <circle cx="128" cy="21" r="2.5" fill="#10b981" filter="url(#glow-serv)"/>
      <circle cx="160" cy="21" r="2.5" fill="#38bdf8" filter="url(#glow-serv)"/>
      <!-- Status Console LEDs & Ports -->
      <circle cx="185" cy="21" r="3" fill="#10b981" filter="url(#glow-serv)"/>
      <circle cx="198" cy="21" r="3" fill="#38bdf8" filter="url(#glow-serv)"/>
      <rect x="210" y="14" width="18" height="14" rx="2" fill="#090d16" stroke="#64748b" stroke-width="1"/>
    </g>

    <!-- SERVER BLADE 3 (Middle-Lower: Compute Node 02 / OVN Chassis) -->
    <g transform="translate(-120, -4)">
      <rect x="0" y="0" width="240" height="42" rx="6" fill="url(#blade-face)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <!-- Cloud Node Badge -->
      <rect x="10" y="10" width="22" height="22" rx="4" fill="#0284c7"/>
      <text x="21" y="25" fill="#ffffff" font-family="Montserrat, sans-serif" font-weight="900" font-size="9" text-anchor="middle">C2</text>
      <!-- Drive Bay Slots -->
      <g fill="#0f172a" stroke="#334155" stroke-width="1">
        <rect x="42" y="10" width="28" height="22" rx="2"/>
        <rect x="74" y="10" width="28" height="22" rx="2"/>
        <rect x="106" y="10" width="28" height="22" rx="2"/>
        <rect x="138" y="10" width="28" height="22" rx="2"/>
      </g>
      <circle cx="64" cy="21" r="2.5" fill="#38bdf8" filter="url(#glow-serv)"/>
      <circle cx="96" cy="21" r="2.5" fill="#10b981" filter="url(#glow-serv)"/>
      <circle cx="128" cy="21" r="2.5" fill="#10b981" filter="url(#glow-serv)"/>
      <circle cx="160" cy="21" r="2.5" fill="#38bdf8" filter="url(#glow-serv)"/>
      <circle cx="185" cy="21" r="3" fill="#10b981" filter="url(#glow-serv)"/>
      <circle cx="198" cy="21" r="3" fill="#38bdf8" filter="url(#glow-serv)"/>
      <rect x="210" y="14" width="18" height="14" rx="2" fill="#090d16" stroke="#64748b" stroke-width="1"/>
    </g>

    <!-- SERVER BLADE 4 (Bottom: High-Speed SDN Switch & Patch Panel) -->
    <g transform="translate(-120, 48)">
      <rect x="0" y="0" width="240" height="46" rx="6" fill="#090d16" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
      <text x="25" y="28" fill="#38bdf8" font-family="Montserrat, sans-serif" font-weight="900" font-size="10">SDN 100G</text>
      <!-- 8 Optical SFP+ Ports with Glowing Network Cable Inserts -->
      <g transform="translate(90, 16)">
        <rect x="0" y="0" width="12" height="16" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="6" cy="-4" r="1.5" fill="#10b981"/>
        <rect x="16" y="0" width="12" height="16" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="22" cy="-4" r="1.5" fill="#10b981"/>
        <rect x="32" y="0" width="12" height="16" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="38" cy="-4" r="1.5" fill="#38bdf8"/>
        <rect x="48" y="0" width="12" height="16" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="54" cy="-4" r="1.5" fill="#10b981"/>
        <rect x="64" y="0" width="12" height="16" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="70" cy="-4" r="1.5" fill="#10b981"/>
        <rect x="80" y="0" width="12" height="16" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="86" cy="-4" r="1.5" fill="#38bdf8"/>
        <rect x="96" y="0" width="12" height="16" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="102" cy="-4" r="1.5" fill="#ee0033"/>
        <rect x="112" y="0" width="12" height="16" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <circle cx="118" cy="-4" r="1.5" fill="#10b981"/>
      </g>
    </g>

    <!-- Fiber Optic Cables Sweeping Downward -->
    <path d="M -20,78 Q -60,95 -100,105" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 0,78 Q 0,98 -15,108" stroke="#10b981" stroke-width="2" fill="none" opacity="0.8"/>
    <path d="M 20,78 Q 40,95 80,105" stroke="#ee0033" stroke-width="2" fill="none" opacity="0.8"/>
  </g>

  <!-- Title & Theme Badge -->
  <g transform="translate(400, 385)">
    <text x="0" y="0" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">VIETTEL CLOUD &#8226; MÁY CHỦ SERVER &amp; SDN</text>
    <text x="0" y="24" fill="#94a3b8" font-family="Poppins, sans-serif" font-weight="500" font-size="13" text-anchor="middle">OpenStack Enterprise &#8226; OVN / Open vSwitch &#8226; Data Center Cluster</text>
  </g>
</svg>
