<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-hcorap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
    <linearGradient id="teal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow-t" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-hcorap)"/>
  <g fill="rgba(255,255,255,0.06)" font-family="Courier New, monospace" font-size="18">
    <text x="40" y="55">SAT(phi) = (x1 OR NOT y2) AND (x3 OR z4)</text>
    <text x="450" y="55">Incremental Solving: S_{t+1} subset S_t</text>
    <text x="40" y="415">Symmetry Breaking Constraints: sigma(X) &lt;= X</text>
  </g>
  <g transform="translate(60, 90)">
    <rect width="320" height="250" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#06b6d4" stroke-width="1.5" filter="url(#glow-t)"/>
    <text x="25" y="38" fill="#38bdf8" font-family="Montserrat, sans-serif" font-size="14" font-weight="bold">HOME CARE RESOURCE ALLOCATION</text>
    <rect x="25" y="65" width="85" height="24" rx="6" fill="#0284c7"/>
    <text x="32" y="81" fill="#fff" font-family="sans-serif" font-size="11">Caregiver 1</text>
    <rect x="120" y="65" width="90" height="24" rx="6" fill="#0d9488"/>
    <text x="126" y="81" fill="#fff" font-family="sans-serif" font-size="11">Patient A (Med)</text>
    <rect x="220" y="65" width="75" height="24" rx="6" fill="#3b82f6"/>
    <text x="226" y="81" fill="#fff" font-family="sans-serif" font-size="11">Transit</text>

    <rect x="25" y="105" width="85" height="24" rx="6" fill="#0284c7"/>
    <text x="32" y="121" fill="#fff" font-family="sans-serif" font-size="11">Caregiver 2</text>
    <rect x="120" y="105" width="70" height="24" rx="6" fill="#6366f1"/>
    <text x="126" y="121" fill="#fff" font-family="sans-serif" font-size="11">Patient B</text>
    <rect x="200" y="105" width="95" height="24" rx="6" fill="#10b981"/>
    <text x="206" y="121" fill="#fff" font-family="sans-serif" font-size="11">Therapy C</text>

    <rect x="25" y="145" width="85" height="24" rx="6" fill="#0284c7"/>
    <text x="32" y="161" fill="#fff" font-family="sans-serif" font-size="11">Caregiver 3</text>
    <rect x="120" y="145" width="130" height="24" rx="6" fill="#f59e0b"/>
    <text x="126" y="161" fill="#fff" font-family="sans-serif" font-size="11">Emergency Unit D</text>

    <text x="25" y="210" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">Search Space Reduced Significantly</text>
    <text x="25" y="230" fill="#94a3b8" font-family="sans-serif" font-size="11">Symmetry-Breaking &amp; Incremental SAT</text>
  </g>
  <g transform="translate(420, 90)">
    <rect width="320" height="250" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="25" y="38" fill="#60a5fa" font-family="Montserrat, sans-serif" font-size="14" font-weight="bold">SATLab RESEARCH @ UET</text>
    <circle cx="70" cy="110" r="22" fill="#0284c7"/>
    <text x="70" y="115" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Var X</text>
    <circle cx="160" cy="75" r="22" fill="#6366f1"/>
    <text x="160" y="80" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Var Y</text>
    <circle cx="250" cy="115" r="22" fill="#10b981"/>
    <text x="250" y="120" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Var Z</text>
    <circle cx="160" cy="170" r="26" fill="#f43f5e" filter="url(#glow-t)"/>
    <text x="160" y="176" fill="#fff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">SOLVER</text>

    <line x1="88" y1="100" x2="140" y2="82" stroke="#38bdf8" stroke-width="2"/>
    <line x1="180" y1="84" x2="230" y2="108" stroke="#38bdf8" stroke-width="2"/>
    <line x1="85" y1="124" x2="138" y2="156" stroke="#38bdf8" stroke-width="2"/>
    <line x1="234" y1="128" x2="182" y2="158" stroke="#38bdf8" stroke-width="2"/>
    <text x="25" y="228" fill="#cbd5e1" font-family="sans-serif" font-size="12">VNU University of Engineering and Technology</text>
  </g>
  <text x="400" y="415" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="800" font-size="22" text-anchor="middle" letter-spacing="1.2">HCORAP : HOME CARE RESOURCE ALLOCATION</text>
</svg>
