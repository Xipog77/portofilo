<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-care" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a0d1b"/>
      <stop offset="55%" stop-color="#0c1424"/>
      <stop offset="100%" stop-color="#03060d"/>
    </radialGradient>
    <linearGradient id="rose-heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="cyan-care" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="home-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow-hcare" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-care)"/>

  <!-- Ambient Care Aura Orbs -->
  <circle cx="330" cy="180" r="140" fill="#e11d48" opacity="0.18" filter="url(#glow-hcare)"/>
  <circle cx="480" cy="180" r="140" fill="#0891b2" opacity="0.16" filter="url(#glow-hcare)"/>

  <!-- Smart IoT Wireless Waves above House -->
  <g stroke="rgba(45, 212, 191, 0.35)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 370,55 A 35,35 0 0,1 430,55"/>
    <path d="M 355,42 A 55,55 0 0,1 445,42"/>
    <path d="M 340,29 A 75,75 0 0,1 460,29"/>
    <circle cx="400" cy="68" r="4" fill="#2dd4bf" filter="url(#glow-hcare)"/>
  </g>

  <!-- Central Home Care Emblem -->
  <g transform="translate(400, 185)">
    <!-- Base Plate Aura -->
    <ellipse cx="0" cy="115" rx="150" ry="24" fill="#f43f5e" opacity="0.25" filter="url(#glow-hcare)"/>

    <!-- Protective Outer House Silhouette -->
    <!-- Roof Peak at (0, -115), Eaves at (-145, -15) & (145, -15), Walls down to (-110, 105) & (110, 105) -->
    <path d="M 0,-115 
             L 145,-5 
             L 115,-5 
             L 115,105 
             L -115,105 
             L -115,-5 
             L -145,-5 Z" 
          fill="url(#home-grad)" stroke="url(#cyan-care)" stroke-width="3" filter="url(#glow-hcare)"/>

    <!-- Inner Protective Window / Shield Glow -->
    <rect x="-95" y="10" width="190" height="85" rx="12" fill="rgba(15, 23, 42, 0.8)" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

    <!-- Medical Heart Symbol in the Center of Home -->
    <g transform="translate(0, 30)" filter="url(#glow-hcare)">
      <!-- Large Beating Heart Base -->
      <path d="M 0,45 
               C -55,0 -70,-35 -50,-55 
               C -30,-75 0,-50 0,-30 
               C 0,-50 30,-75 50,-55 
               C 70,-35 55,0 0,45 Z" 
            fill="url(#rose-heart)" stroke="#ffffff" stroke-width="2"/>

      <!-- Heart Depth Highlight -->
      <path d="M -38,-50 C -25,-62 -5,-45 -2,-30 C -15,-30 -30,-38 -38,-50 Z" fill="#ffffff" opacity="0.4"/>
    </g>

    <!-- Glowing Active ECG Pulse / Heartbeat Lifeline across the Heart -->
    <g filter="url(#glow-hcare)">
      <!-- Background ECG Guide Line -->
      <line x1="-120" y1="32" x2="120" y2="32" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
      
      <!-- Vivid ECG Pulse Wave -->
      <path d="M -120,32 
               L -55,32 
               L -42,32 
               L -35,22 
               L -25,42 
               L -15,-10 
               L 0,72 
               L 15,-28 
               L 28,45 
               L 36,25 
               L 44,32 
               L 120,32" 
            fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Medical Cross Badge on the Rooftop Gable -->
    <g transform="translate(0, -60)" filter="url(#glow-hcare)">
      <circle cx="0" cy="0" r="18" fill="#0f172a" stroke="url(#cyan-care)" stroke-width="2"/>
      <!-- Cross Horizontal & Vertical -->
      <rect x="-10" y="-3.5" width="20" height="7" rx="2" fill="#2dd4bf"/>
      <rect x="-3.5" y="-10" width="7" height="20" rx="2" fill="#2dd4bf"/>
    </g>

    <!-- Vital Health Metric Pills on Sides -->
    <!-- Left: SpO2 Pill -->
    <g transform="translate(-70, 75)" filter="url(#glow-hcare)">
      <rect x="-24" y="-11" width="48" height="22" rx="11" fill="#0f172a" stroke="#2dd4bf" stroke-width="1.5"/>
      <text x="0" y="4" fill="#2dd4bf" font-family="Montserrat, sans-serif" font-weight="900" font-size="10" text-anchor="middle">98%</text>
    </g>
    <!-- Right: BPM Pill -->
    <g transform="translate(70, 75)" filter="url(#glow-hcare)">
      <rect x="-24" y="-11" width="48" height="22" rx="11" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/>
      <text x="0" y="4" fill="#fb7185" font-family="Montserrat, sans-serif" font-weight="900" font-size="10" text-anchor="middle">75 BPM</text>
    </g>
  </g>

  <!-- Title & Theme Badge -->
  <g transform="translate(400, 385)">
    <text x="0" y="0" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">HCORAP &#8226; CHĂM SÓC SỨC KHỎE GIA ĐÌNH</text>
    <text x="0" y="24" fill="#94a3b8" font-family="Poppins, sans-serif" font-weight="500" font-size="13" text-anchor="middle">Smart Home Care &#8226; IoT Vital Monitoring &#8226; SATLab UET Research</text>
  </g>
</svg>
