<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-ticket" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1205"/>
      <stop offset="55%" stop-color="#140a17"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rush-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="rush-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow-ticket" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-ticket)"/>

  <!-- Ambient Rush Energy Orbs -->
  <circle cx="320" cy="225" r="160" fill="#ea580c" opacity="0.22" filter="url(#glow-ticket)"/>
  <circle cx="500" cy="225" r="150" fill="#06b6d4" opacity="0.16" filter="url(#glow-ticket)"/>

  <!-- Speed / Flash Rush Rays -->
  <g stroke="rgba(251, 146, 60, 0.2)" stroke-width="2" stroke-linecap="round">
    <line x1="140" y1="120" x2="220" y2="150"/>
    <line x1="110" y1="225" x2="200" y2="225"/>
    <line x1="130" y1="330" x2="215" y2="300"/>
    <line x1="580" y1="150" x2="670" y2="120"/>
    <line x1="600" y1="225" x2="690" y2="225"/>
    <line x1="585" y1="300" x2="670" y2="330"/>
  </g>

  <!-- The Golden Flash-Sale Event Ticket (Centered & Scaled) -->
  <g transform="translate(400, 225) rotate(-3) scale(1.15)">
    <!-- Base Plate Glow -->
    <rect x="-180" y="-95" width="360" height="190" rx="18" fill="#f97316" opacity="0.25" filter="url(#glow-ticket)"/>

    <!-- Ticket Main Body Path with Circular Cutouts on Top and Bottom at x = 65 -->
    <path d="M -170,-85 
             H 50 
             A 16,16 0 0,0 82,-85 
             H 170 
             A 16,16 0 0,1 186,-69 
             V 69 
             A 16,16 0 0,1 170,85 
             H 82 
             A 16,16 0 0,0 50,85 
             H -170 
             A 16,16 0 0,1 -186,69 
             V -69 
             A 16,16 0 0,1 -170,-85 Z" 
          fill="url(#ticket-grad)" stroke="url(#rush-orange)" stroke-width="2.5" filter="url(#glow-ticket)"/>

    <!-- Perforated Tear Line at x = 66 -->
    <line x1="66" y1="-68" x2="66" y2="68" stroke="rgba(251, 146, 60, 0.45)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6,6"/>

    <!-- LEFT STUB: GRAPHICAL ELEMENTS & LIGHTNING RUSH -->
    <!-- Golden Star Badge -->
    <g transform="translate(-142, -55)" filter="url(#glow-ticket)">
      <polygon points="0,-12 3.5,-3.5 12,-3.5 5,2 8,11 0,6 -8,11 -5,2 -12,-3.5 -3.5,-3.5" fill="url(#rush-gold)"/>
    </g>

    <!-- Rush Lightning Bolt Icon -->
    <g transform="translate(-85, -15)" filter="url(#glow-ticket)">
      <polygon points="18,-42 -6,-3 10,-3 -12,42 24,-3 6,-3" fill="url(#rush-gold)"/>
    </g>

    <!-- Geometric Graphic Soundwave / Energy Rails -->
    <g transform="translate(-10, -15)" fill="#38bdf8" opacity="0.8">
      <rect x="-35" y="-18" width="5" height="36" rx="2.5"/>
      <rect x="-24" y="-28" width="5" height="56" rx="2.5"/>
      <rect x="-13" y="-12" width="5" height="24" rx="2.5"/>
      <rect x="-2" y="-35" width="5" height="70" rx="2.5" fill="#fde047"/>
      <rect x="9" y="-20" width="5" height="40" rx="2.5"/>
      <rect x="20" y="-10" width="5" height="20" rx="2.5"/>
      <rect x="31" y="-25" width="5" height="50" rx="2.5"/>
    </g>

    <!-- Barcode Strip at Bottom Left (Pure Graphical Pattern) -->
    <g transform="translate(-160, 48)" fill="#f8fafc" opacity="0.85">
      <rect x="0" y="0" width="3.5" height="24"/>
      <rect x="6" y="0" width="2" height="24"/>
      <rect x="11" y="0" width="5" height="24"/>
      <rect x="19" y="0" width="2" height="24"/>
      <rect x="24" y="0" width="4" height="24"/>
      <rect x="31" y="0" width="2" height="24"/>
      <rect x="36" y="0" width="6" height="24"/>
      <rect x="45" y="0" width="2" height="24"/>
      <rect x="50" y="0" width="5" height="24"/>
      <rect x="58" y="0" width="3" height="24"/>
      <rect x="64" y="0" width="2" height="24"/>
      <rect x="69" y="0" width="6" height="24"/>
      <rect x="78" y="0" width="2" height="24"/>
      <rect x="83" y="0" width="4" height="24"/>
      <rect x="90" y="0" width="3" height="24"/>
      <rect x="96" y="0" width="5" height="24"/>
      <rect x="104" y="0" width="2" height="24"/>
      <rect x="109" y="0" width="4" height="24"/>
      <rect x="116" y="0" width="2" height="24"/>
      <rect x="121" y="0" width="6" height="24"/>
      <rect x="130" y="0" width="3" height="24"/>
      <rect x="136" y="0" width="2" height="24"/>
      <rect x="141" y="0" width="5" height="24"/>
      <rect x="149" y="0" width="2" height="24"/>
      <rect x="154" y="0" width="4" height="24"/>
      <rect x="161" y="0" width="3" height="24"/>
      <rect x="167" y="0" width="5" height="24"/>
      <rect x="175" y="0" width="2" height="24"/>
      <rect x="180" y="0" width="4" height="24"/>
      <rect x="187" y="0" width="6" height="24"/>
      <rect x="196" y="0" width="3" height="24"/>
    </g>

    <!-- RIGHT STUB: SCANNABLE QR PASS & GRAPHIC BADGE -->
    <g transform="translate(126, -15)">
      <!-- Scannable Holographic QR Frame -->
      <rect x="-35" y="-35" width="70" height="70" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      <!-- QR Pattern Emulation -->
      <g fill="#38bdf8">
        <!-- Top-Left Target Box -->
        <rect x="-29" y="-29" width="16" height="16" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <rect x="-25" y="-25" width="8" height="8"/>
        <!-- Top-Right Target Box -->
        <rect x="13" y="-29" width="16" height="16" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <rect x="17" y="-25" width="8" height="8"/>
        <!-- Bottom-Left Target Box -->
        <rect x="-29" y="13" width="16" height="16" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <rect x="-25" y="17" width="8" height="8"/>
        <!-- Data Dots -->
        <rect x="-7" y="-29" width="4" height="4"/>
        <rect x="1" y="-25" width="4" height="4"/>
        <rect x="-7" y="-17" width="6" height="6"/>
        <rect x="3" y="-15" width="4" height="4"/>
        <rect x="-2" y="-5" width="6" height="6"/>
        <rect x="-25" y="-5" width="5" height="5"/>
        <rect x="15" y="-5" width="6" height="6"/>
        <rect x="-7" y="5" width="4" height="4"/>
        <rect x="5" y="5" width="5" height="5"/>
        <rect x="19" y="15" width="6" height="6"/>
        <rect x="-5" y="19" width="6" height="6"/>
      </g>
    </g>

    <!-- Sub-stub Star Icons -->
    <g transform="translate(126, 55)" filter="url(#glow-ticket)">
      <circle cx="-16" cy="0" r="4" fill="#fde047"/>
      <circle cx="0" cy="0" r="6" fill="#f97316"/>
      <circle cx="16" cy="0" r="4" fill="#fde047"/>
    </g>
  </g>
</svg>
