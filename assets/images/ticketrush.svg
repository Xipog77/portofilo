<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-tr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="redis-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="glow-p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-tr)"/>
  <!-- Top Badges -->
  <g transform="translate(60, 35)">
    <rect width="180" height="32" rx="8" fill="url(#neon-pink)"/>
    <text x="90" y="21" fill="#fff" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" text-anchor="middle">TICKETRUSH ENGINE</text>
    <rect x="250" y="0" width="130" height="32" rx="8" fill="url(#redis-red)"/>
    <text x="315" y="21" fill="#fff" font-family="Montserrat, sans-serif" font-weight="800" font-size="12" text-anchor="middle">REDIS 7 QUEUE</text>
    <rect x="390" y="0" width="140" height="32" rx="8" fill="rgba(14, 165, 233, 0.2)" stroke="#0ea5e9" stroke-width="1"/>
    <text x="460" y="21" fill="#38bdf8" font-family="Montserrat, sans-serif" font-weight="700" font-size="12" text-anchor="middle">GOLANG GIN API</text>
  </g>
  <!-- Interactive Seat Map Graphic -->
  <g transform="translate(60, 90)">
    <rect width="320" height="230" rx="14" fill="#18181b" stroke="#ec4899" stroke-width="1.5" filter="url(#glow-p)"/>
    <text x="25" y="32" fill="#f472b6" font-family="Montserrat, sans-serif" font-size="13" font-weight="bold">HIGH-CONCURRENCY SEAT MATRIX</text>
    <!-- Stage -->
    <rect x="50" y="50" width="220" height="20" rx="4" fill="#3f3f46"/>
    <text x="160" y="64" fill="#a1a1aa" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">MAIN STAGE (CONCERT)</text>
    <!-- Seat Grid -->
    <g transform="translate(45, 85)">
      <!-- VVIP Row -->
      <circle cx="15" cy="15" r="8" fill="#10b981"/>
      <circle cx="45" cy="15" r="8" fill="#ef4444"/>
      <circle cx="75" cy="15" r="8" fill="#ef4444"/>
      <circle cx="105" cy="15" r="8" fill="#10b981"/>
      <circle cx="135" cy="15" r="8" fill="#eab308"/>
      <circle cx="165" cy="15" r="8" fill="#10b981"/>
      <circle cx="195" cy="15" r="8" fill="#ef4444"/>
      <circle cx="225" cy="15" r="8" fill="#10b981"/>
      <!-- VIP Row -->
      <circle cx="15" cy="40" r="8" fill="#10b981"/>
      <circle cx="45" cy="40" r="8" fill="#10b981"/>
      <circle cx="75" cy="40" r="8" fill="#ef4444"/>
      <circle cx="105" cy="40" r="8" fill="#ef4444"/>
      <circle cx="135" cy="40" r="8" fill="#10b981"/>
      <circle cx="165" cy="40" r="8" fill="#eab308"/>
      <circle cx="195" cy="40" r="8" fill="#10b981"/>
      <circle cx="225" cy="40" r="8" fill="#ef4444"/>
      <!-- Standard Row -->
      <circle cx="15" cy="65" r="8" fill="#ef4444"/>
      <circle cx="45" cy="65" r="8" fill="#10b981"/>
      <circle cx="75" cy="65" r="8" fill="#10b981"/>
      <circle cx="105" cy="65" r="8" fill="#10b981"/>
      <circle cx="135" cy="65" r="8" fill="#ef4444"/>
      <circle cx="165" cy="65" r="8" fill="#10b981"/>
      <circle cx="195" cy="65" r="8" fill="#10b981"/>
      <circle cx="225" cy="65" r="8" fill="#10b981"/>
    </g>
    <!-- Legend -->
    <text x="25" y="200" fill="#a1a1aa" font-family="sans-serif" font-size="10"><tspan fill="#10b981">● Trống</tspan>  <tspan fill="#eab308">● Đang giữ</tspan>  <tspan fill="#ef4444">● Đã bán (Locked)</tspan></text>
    <text x="25" y="218" fill="#38bdf8" font-family="sans-serif" font-size="10">Real-time WebSockets Sync</text>
  </g>
  <!-- Concurrency & Architecture -->
  <g transform="translate(420, 90)">
    <rect width="320" height="230" rx="14" fill="#18181b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="25" y="32" fill="#c084fc" font-family="Montserrat, sans-serif" font-size="13" font-weight="bold">FLASH SALE CONCURRENCY CONTROL</text>
    <!-- Virtual Queue Box -->
    <rect x="25" y="55" width="270" height="42" rx="8" fill="#27272a" stroke="#dc2626"/>
    <text x="160" y="80" fill="#fca5a5" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Redis Virtual Waiting Room (Priority Queue)</text>
    <!-- Pessimistic Lock -->
    <rect x="25" y="108" width="270" height="42" rx="8" fill="#27272a" stroke="#eab308"/>
    <text x="160" y="133" fill="#fef08a" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Pessimistic Lock (SELECT FOR UPDATE)</text>
    <!-- Atomic Order Execution -->
    <rect x="25" y="160" width="270" height="42" rx="8" fill="#27272a" stroke="#10b981"/>
    <text x="160" y="185" fill="#86efac" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">PostgreSQL 15 ACID + QR Ticket Generation</text>
  </g>
  <g transform="translate(60, 340)">
    <rect width="680" height="42" rx="8" fill="rgba(24, 24, 27, 0.9)" stroke="#3f3f46"/>
    <text x="20" y="26" fill="#a1a1aa" font-family="sans-serif" font-size="12">Domain-Driven Design (DDD) • Zero Double-booking • High QPS Stress Tested • Docker Compose</text>
  </g>
  <text x="400" y="420" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="800" font-size="18" text-anchor="middle" letter-spacing="1">TICKETRUSH — HIGH-CONCURRENCY EVENT BOOKING PLATFORM</text>
</svg>
