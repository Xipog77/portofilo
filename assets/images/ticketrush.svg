<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-ticket" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1205"/>
      <stop offset="55%" stop-color="#140a17"/>
      <stop offset="100%" stop-color="#050308"/>
    </radialGradient>
    <linearGradient id="ticket-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="rush-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="rush-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow-ticket" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-ticket)"/>

  <!-- Ambient Rush Energy Orbs -->
  <circle cx="320" cy="180" r="140" fill="#ea580c" opacity="0.2" filter="url(#glow-ticket)"/>
  <circle cx="500" cy="180" r="130" fill="#06b6d4" opacity="0.14" filter="url(#glow-ticket)"/>

  <!-- Speed / Flash Rush Rays -->
  <g stroke="rgba(251, 146, 60, 0.18)" stroke-width="2" stroke-linecap="round">
    <line x1="160" y1="90" x2="230" y2="120"/>
    <line x1="130" y1="180" x2="210" y2="180"/>
    <line x1="150" y1="260" x2="225" y2="240"/>
    <line x1="570" y1="120" x2="650" y2="90"/>
    <line x1="590" y1="180" x2="670" y2="180"/>
    <line x1="575" y1="240" x2="660" y2="260"/>
  </g>

  <!-- The Golden Flash-Sale Event Ticket -->
  <!-- Angled slightly for dynamic modern look: rotate(-4) -->
  <g transform="translate(400, 185) rotate(-4)">
    <!-- Base Plate Glow -->
    <rect x="-180" y="-95" width="360" height="190" rx="16" fill="#f97316" opacity="0.25" filter="url(#glow-ticket)"/>

    <!-- Ticket Main Body Path with Notches at top and bottom (Tear Notches) -->
    <path d="M -170,-85 
             L 60,-85 
             A 18,18 0 0,1 60,-49
             L 60,-49 
             L 60,-49
             A 0,0 0 0,0 60,-49
             L 60,-85
             M -170,-85
             H 60
             A 16,16 0 0,1 92,-85
             H 170
             A 16,16 0 0,1 186,-69
             V 69
             A 16,16 0 0,1 170,85
             H 92
             A 16,16 0 0,1 60,85
             H -170
             A 16,16 0 0,1 -186,69
             V -69
             A 16,16 0 0,1 -170,-85 Z" fill="none"/>

    <!-- Custom Path for Ticket with Circular Cutouts on Top and Bottom at x = 70 -->
    <path d="M -170,-85 
             H 54 
             A 16,16 0 0,0 86,-85 
             H 170 
             A 16,16 0 0,1 186,-69 
             V 69 
             A 16,16 0 0,1 170,85 
             H 86 
             A 16,16 0 0,0 54,85 
             H -170 
             A 16,16 0 0,1 -186,69 
             V -69 
             A 16,16 0 0,1 -170,-85 Z" 
          fill="url(#ticket-grad)" stroke="url(#rush-orange)" stroke-width="2.5" filter="url(#glow-ticket)"/>

    <!-- Perforated Tear Line at x = 70 -->
    <line x1="70" y1="-68" x2="70" y2="68" stroke="rgba(251, 146, 60, 0.4)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6,6"/>

    <!-- LEFT STUB: MAIN EVENT DETAILS & BRANDING -->
    <!-- VIP Tag Pill -->
    <rect x="-160" y="-68" width="64" height="22" rx="11" fill="rgba(249, 115, 22, 0.2)" stroke="url(#rush-gold)" stroke-width="1.5"/>
    <text x="-128" y="-53" fill="#fde047" font-family="Montserrat, sans-serif" font-weight="900" font-size="11" text-anchor="middle" letter-spacing="1">LIVE VIP</text>

    <!-- Rush Lightning Icon -->
    <g transform="translate(-150, 0)" filter="url(#glow-ticket)">
      <polygon points="12,-28 -4,-2 6,-2 -8,28 16,-2 4,-2" fill="url(#rush-gold)"/>
    </g>

    <!-- Ticket Event Title & Time -->
    <g transform="translate(-105, -5)">
      <text x="0" y="-12" fill="#ffffff" font-family="Montserrat, sans-serif" font-weight="900" font-size="20" letter-spacing="1.5">TICKETRUSH</text>
      <text x="0" y="10" fill="#38bdf8" font-family="Montserrat, sans-serif" font-weight="700" font-size="12" letter-spacing="1">FLASH SALE &#8226; GATE A &#8226; ROW 01</text>
      <text x="0" y="28" fill="#94a3b8" font-family="Poppins, sans-serif" font-size="10">CONCURRENCY &#8226; 10,000+ REQ/SEC</text>
    </g>

    <!-- Barcode Strip at Bottom Left -->
    <g transform="translate(-160, 48)" fill="#f8fafc" opacity="0.8">
      <rect x="0" y="0" width="3" height="22"/>
      <rect x="5" y="0" width="2" height="22"/>
      <rect x="9" y="0" width="5" height="22"/>
      <rect x="17" y="0" width="2" height="22"/>
      <rect x="22" y="0" width="4" height="22"/>
      <rect x="29" y="0" width="2" height="22"/>
      <rect x="33" y="0" width="6" height="22"/>
      <rect x="42" y="0" width="2" height="22"/>
      <rect x="47" y="0" width="5" height="22"/>
      <rect x="55" y="0" width="3" height="22"/>
      <rect x="61" y="0" width="2" height="22"/>
      <rect x="66" y="0" width="6" height="22"/>
      <rect x="75" y="0" width="2" height="22"/>
      <rect x="80" y="0" width="4" height="22"/>
      <rect x="87" y="0" width="3" height="22"/>
      <rect x="93" y="0" width="5" height="22"/>
      <rect x="101" y="0" width="2" height="22"/>
      <rect x="106" y="0" width="4" height="22"/>
      <rect x="113" y="0" width="2" height="22"/>
      <rect x="118" y="0" width="6" height="22"/>
      <rect x="127" y="0" width="3" height="22"/>
      <rect x="133" y="0" width="2" height="22"/>
      <rect x="138" y="0" width="5" height="22"/>
      <rect x="146" y="0" width="2" height="22"/>
      <rect x="151" y="0" width="4" height="22"/>
      <rect x="158" y="0" width="3" height="22"/>
      <rect x="164" y="0" width="5" height="22"/>
      <rect x="172" y="0" width="2" height="22"/>
      <rect x="177" y="0" width="4" height="22"/>
      <rect x="184" y="0" width="6" height="22"/>
      <rect x="193" y="0" width="2" height="22"/>
      <rect x="198" y="0" width="4" height="22"/>
      <text x="100" y="32" fill="#64748b" font-family="monospace" font-size="8" text-anchor="middle">NO. 88392019482</text>
    </g>

    <!-- RIGHT STUB: SCANNABLE QR PASS & SEAT INFO -->
    <g transform="translate(128, -25)">
      <!-- Scannable Holographic QR Frame -->
      <rect x="-35" y="-35" width="70" height="70" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      <!-- QR Pattern Emulation -->
      <g fill="#38bdf8">
        <!-- Top-Left Target Box -->
        <rect x="-29" y="-29" width="16" height="16" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <rect x="-25" y="-25" width="8" height="8"/>
        <!-- Top-Right Target Box -->
        <rect x="13" y="-29" width="16" height="16" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <rect x="17" y="-25" width="8" height="8"/>
        <!-- Bottom-Left Target Box -->
        <rect x="-29" y="13" width="16" height="16" fill="none" stroke="#38bdf8" stroke-width="2"/>
        <rect x="-25" y="17" width="8" height="8"/>
        <!-- Data Dots -->
        <rect x="-7" y="-29" width="4" height="4"/>
        <rect x="1" y="-25" width="4" height="4"/>
        <rect x="-7" y="-17" width="6" height="6"/>
        <rect x="3" y="-15" width="4" height="4"/>
        <rect x="-2" y="-5" width="6" height="6"/>
        <rect x="-25" y="-5" width="5" height="5"/>
        <rect x="15" y="-5" width="6" height="6"/>
        <rect x="-7" y="5" width="4" height="4"/>
        <rect x="5" y="5" width="5" height="5"/>
        <rect x="19" y="15" width="6" height="6"/>
        <rect x="-5" y="19" width="6" height="6"/>
      </g>
    </g>
    <text x="128" y="60" fill="#fde047" font-family="Montserrat, sans-serif" font-weight="900" font-size="13" text-anchor="middle">ADMIT 1</text>
    <text x="128" y="74" fill="#94a3b8" font-family="Poppins, sans-serif" font-weight="600" font-size="9" text-anchor="middle">PASS &#8226; 2026</text>
  </g>

  <!-- Title & Theme Badge -->
  <g transform="translate(400, 385)">
    <text x="0" y="0" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">TICKETRUSH &#8226; VÉ SỰ KIỆN &amp; FLASH SALE</text>
    <text x="0" y="24" fill="#94a3b8" font-family="Poppins, sans-serif" font-weight="500" font-size="13" text-anchor="middle">High-Concurrency Booking &#8226; Redis Lock &#8226; RabbitMQ &#8226; Go / Java</text>
  </g>
</svg>
