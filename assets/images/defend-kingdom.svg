<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-defend" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="ruby-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-defend)"/>
  <!-- Castle Fortress Silhouette -->
  <g transform="translate(100, 70)">
    <!-- Tower Left -->
    <rect x="20" y="90" width="80" height="170" fill="#334155" rx="4"/>
    <polygon points="10,90 60,35 110,90" fill="url(#ruby-grad)"/>
    <rect x="45" y="120" width="30" height="40" rx="15" fill="#0f172a"/>
    <!-- Castle Wall -->
    <rect x="100" y="140" width="160" height="120" fill="#475569"/>
    <rect x="150" y="180" width="60" height="80" rx="30" fill="#0f172a"/>
    <!-- Wall battlements -->
    <rect x="105" y="125" width="25" height="15" fill="#475569"/>
    <rect x="145" y="125" width="25" height="15" fill="#475569"/>
    <rect x="190" y="125" width="25" height="15" fill="#475569"/>
    <rect x="230" y="125" width="25" height="15" fill="#475569"/>
    <!-- Tower Right -->
    <rect x="260" y="90" width="80" height="170" fill="#334155" rx="4"/>
    <polygon points="250,90 300,35 350,90" fill="url(#ruby-grad)"/>
    <rect x="285" y="120" width="30" height="40" rx="15" fill="#0f172a"/>
    <!-- Shield Insignia -->
    <g transform="translate(150, 75)">
      <path d="M30,0 L60,18 V55 C60,80 30,100 30,100 C30,100 0,80 0,55 V18 Z" fill="url(#gold-grad)"/>
      <path d="M30,15 L30,80 M15,40 L45,40" stroke="#1e1b4b" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <!-- Technical Specifications Card -->
  <g transform="translate(480, 85)">
    <rect width="260" height="245" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="25" y="40" fill="#f87171" font-family="Montserrat, sans-serif" font-size="16" font-weight="bold">C++ &amp; SDL2 ENGINE</text>
    <text x="25" y="75" fill="#cbd5e1" font-family="sans-serif" font-size="13">• Custom 2D Game Engine</text>
    <text x="25" y="105" fill="#cbd5e1" font-family="sans-serif" font-size="13">• Advanced Memory Management</text>
    <text x="25" y="135" fill="#cbd5e1" font-family="sans-serif" font-size="13">• Dynamic Wave Spawning</text>
    <text x="25" y="165" fill="#cbd5e1" font-family="sans-serif" font-size="13">• Performance Optimization</text>
    <rect x="25" y="190" width="130" height="28" rx="6" fill="#b91c1c"/>
    <text x="90" y="209" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Full-Stack Dev</text>
  </g>
  <text x="400" y="415" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="800" font-size="22" text-anchor="middle" letter-spacing="1.2">DEFEND THE KINGDOM : 2D TOWER DEFENSE GAME</text>
</svg>
