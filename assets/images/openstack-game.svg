<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-cloud-game" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f224a"/>
      <stop offset="55%" stop-color="#091126"/>
      <stop offset="100%" stop-color="#030610"/>
    </radialGradient>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cube-top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="game-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="glow-cgame" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-cloud-game)"/>

  <!-- Ambient Glow -->
  <circle cx="320" cy="180" r="140" fill="#0284c7" opacity="0.2" filter="url(#glow-cgame)"/>
  <circle cx="480" cy="180" r="140" fill="#16a34a" opacity="0.14" filter="url(#glow-cgame)"/>

  <!-- High Availability Orbit Rings -->
  <g transform="translate(400, 185)">
    <!-- Tilted Ellipse Orbits -->
    <ellipse cx="0" cy="0" rx="170" ry="70" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" stroke-dasharray="6,8" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="170" ry="70" fill="none" stroke="rgba(74, 222, 128, 0.2)" stroke-width="1.5" stroke-dasharray="4,6" transform="rotate(25)"/>

    <!-- Orbiting VM Node 1 -->
    <g transform="translate(-140, -40)" filter="url(#glow-cgame)">
      <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#38bdf8"/>
    </g>

    <!-- Orbiting VM Node 2 -->
    <g transform="translate(145, 35)" filter="url(#glow-cgame)">
      <circle cx="0" cy="0" r="12" fill="#0f172a" stroke="#4ade80" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#4ade80"/>
    </g>

    <!-- Orbiting VM Node 3 (Top Right) -->
    <g transform="translate(100, -60)" filter="url(#glow-cgame)">
      <circle cx="0" cy="0" r="9" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
      <circle cx="0" cy="0" r="3.5" fill="#f59e0b"/>
    </g>

    <!-- Base Holographic Cloud Platform -->
    <g transform="translate(0, 75)">
      <ellipse cx="0" cy="10" rx="130" ry="24" fill="#0284c7" opacity="0.3" filter="url(#glow-cgame)"/>
      <!-- Cloud Outline -->
      <path d="M -85,5 C -105,5 -120,-10 -115,-25 C -112,-38 -98,-45 -85,-42 C -80,-65 -50,-80 -25,-75 C -15,-90 15,-92 30,-78 C 45,-85 70,-75 75,-55 C 95,-55 110,-40 108,-25 C 105,-5 90,5 75,5 Z" 
            fill="rgba(15, 23, 42, 0.85)" stroke="url(#cloud-grad)" stroke-width="2.5" filter="url(#glow-cgame)"/>
    </g>

    <!-- Central Isometric 3D Game Server Cube -->
    <g transform="translate(0, -20)">
      <!-- Isometric Cube Top Face -->
      <!-- Center (0, -35), Right (65, 0), Bottom (0, 35), Left (-65, 0) -->
      <polygon points="0,-75 65,-40 0,-5 -65,-40" fill="url(#cube-top)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow-cgame)"/>

      <!-- Isometric Cube Left Face -->
      <polygon points="-65,-40 0,-5 0,70 -65,35" fill="url(#cube-left)" stroke="#0284c7" stroke-width="1.5"/>

      <!-- Isometric Cube Right Face -->
      <polygon points="0,-5 65,-40 65,35 0,70" fill="url(#cube-right)" stroke="#0284c7" stroke-width="1.5"/>

      <!-- Pixel Game Grid / Creeper-Voxel Style Pattern on Front Faces -->
      <!-- Left Face Server Slots -->
      <g stroke="#38bdf8" stroke-width="1.5" fill="none" opacity="0.7">
        <line x1="-50" y1="-15" x2="-15" y2="3"/>
        <line x1="-50" y1="5" x2="-15" y2="23"/>
        <line x1="-50" y1="25" x2="-15" y2="43"/>
      </g>
      <circle cx="-35" cy="5" r="2.5" fill="#4ade80" filter="url(#glow-cgame)"/>
      <circle cx="-35" cy="25" r="2.5" fill="#38bdf8" filter="url(#glow-cgame)"/>

      <!-- Right Face Gaming Controller / Pixel Icon -->
      <g transform="translate(32, 16)">
        <polygon points="-12,-15 12,-28 12,-10 -12,3" fill="#4ade80" opacity="0.6"/>
        <polygon points="-12,5 12,-8 12,10 -12,23" fill="#4ade80" opacity="0.8"/>
        <!-- Gamepad cross on face -->
        <circle cx="0" cy="0" r="3" fill="#ffffff" filter="url(#glow-cgame)"/>
      </g>

      <!-- Center Floating Neon Emblem (Gaming Joystick on Top Face) -->
      <g transform="translate(0, -40)" filter="url(#glow-cgame)">
        <circle cx="0" cy="0" r="8" fill="#4ade80"/>
        <line x1="0" y1="0" x2="0" y2="-18" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
        <circle cx="0" cy="-22" r="7" fill="#f43f5e"/>
      </g>
    </g>
  </g>

  <!-- Title & Theme Badge -->
  <g transform="translate(400, 385)">
    <text x="0" y="0" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">OPENSTACK GAME &#8226; CLOUD &amp; MÁY CHỦ GAME</text>
    <text x="0" y="24" fill="#94a3b8" font-family="Poppins, sans-serif" font-weight="500" font-size="13" text-anchor="middle">OpenStack Cloud Platform &#8226; High Availability VM &#8226; Game Server Engine</text>
  </g>
</svg>
