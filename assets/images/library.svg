<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <radialGradient id="bg-lib" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#063529"/>
      <stop offset="55%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#050a14"/>
    </radialGradient>
    <linearGradient id="emerald-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gold-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="page-left" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="85%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="page-right" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="glow-lib" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-lib)"/>

  <!-- Ambient Orbs -->
  <circle cx="330" cy="180" r="140" fill="#10b981" opacity="0.16" filter="url(#glow-lib)"/>
  <circle cx="480" cy="180" r="130" fill="#f59e0b" opacity="0.12" filter="url(#glow-lib)"/>

  <!-- Iconic Open Book Display -->
  <g transform="translate(400, 185)">
    <!-- Aura Ring -->
    <ellipse cx="0" cy="30" rx="190" ry="60" fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="2" stroke-dasharray="6,8"/>
    
    <!-- Base Glow Plate -->
    <ellipse cx="0" cy="45" rx="140" ry="25" fill="#047857" opacity="0.3" filter="url(#glow-lib)"/>

    <!-- Book Cover Base (Dark Leather/Teal) -->
    <path d="M-150,20 C-110,40 -40,35 0,40 C40,35 110,40 150,20 C155,30 152,40 148,45 C110,65 40,60 0,65 C-40,60 -110,65 -148,45 C-152,40 -155,30 -150,20 Z" 
          fill="#064e3b" stroke="#34d399" stroke-width="2" filter="url(#glow-lib)"/>

    <!-- Back Page Spread (Thickness) -->
    <path d="M-140,10 C-100,28 -30,25 0,28 C30,25 100,28 140,10 L145,28 C105,45 35,42 0,45 C-35,42 -105,45 -145,28 Z" fill="#94a3b8" opacity="0.4"/>

    <!-- Left Open Page -->
    <path d="M 0,22 C -45,18 -115,10 -138,-65 C -95,-60 -35,-45 0,-40 Z" 
          fill="url(#page-left)" stroke="#059669" stroke-width="2"/>

    <!-- Right Open Page -->
    <path d="M 0,22 C 45,18 115,10 138,-65 C 95,-60 35,-45 0,-40 Z" 
          fill="url(#page-right)" stroke="#059669" stroke-width="2"/>

    <!-- Spine Binding Shadow -->
    <path d="M-5,-42 Q0,25 0,25 Q0,25 5,-42 Z" fill="#065f46" opacity="0.7"/>

    <!-- Text / Content Lines on Left Page -->
    <g stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.65">
      <line x1="-115" y1="-45" x2="-25" y2="-32"/>
      <line x1="-115" y1="-28" x2="-25" y2="-17"/>
      <line x1="-110" y1="-11" x2="-25" y2="-2"/>
      <line x1="-105" y1="6" x2="-35" y2="13"/>
    </g>

    <!-- Text / Content Lines on Right Page -->
    <g stroke="#64748b" stroke-width="3" stroke-linecap="round" opacity="0.65">
      <line x1="25" y1="-32" x2="115" y2="-45"/>
      <line x1="25" y1="-17" x2="115" y2="-28"/>
      <line x1="25" y1="-2" x2="110" y2="-11"/>
      <line x1="35" y1="13" x2="105" y2="6"/>
    </g>

    <!-- Golden Bookmark Ribbon -->
    <path d="M 0,-40 Q 15,-10 25,35 L 35,55 L 20,48 L 5,55 L 8,30 Q 5,-15 0,-40 Z" 
          fill="url(#gold-glow)" stroke="#b45309" stroke-width="1.5" filter="url(#glow-lib)"/>

    <!-- Magic Knowledge Particles / Stars -->
    <g fill="#34d399" filter="url(#glow-lib)">
      <polygon points="0,-85 3,-75 13,-72 3,-69 0,-59 -3,-69 -13,-72 -3,-75"/>
      <polygon points="-80,-95 -78,-87 -70,-85 -78,-83 -80,-75 -82,-83 -90,-85 -82,-87" transform="scale(0.8) translate(-15, -10)"/>
      <polygon points="85,-90 87,-83 94,-81 87,-79 85,-72 83,-79 76,-81 83,-83" transform="scale(0.8) translate(15, -10)"/>
    </g>
  </g>

  <!-- Title & Theme Badge -->
  <g transform="translate(400, 385)">
    <text x="0" y="0" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="2">QUẢN LÝ THƯ VIỆN &#8226; LIBRARY MANAGEMENT</text>
    <text x="0" y="24" fill="#94a3b8" font-family="Poppins, sans-serif" font-weight="500" font-size="13" text-anchor="middle">JavaFX &#8226; MySQL Database &#8226; Clean Architecture &amp; OOP</text>
  </g>
</svg>
