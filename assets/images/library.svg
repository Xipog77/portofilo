<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-lib" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-lib)"/>
  <!-- UI Window Mockup -->
  <g transform="translate(100, 60)">
    <rect width="600" height="300" rx="14" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <!-- Window Bar -->
    <rect width="600" height="38" rx="14" fill="#0f172a"/>
    <circle cx="25" cy="19" r="6" fill="#ef4444"/>
    <circle cx="45" cy="19" r="6" fill="#eab308"/>
    <circle cx="65" cy="19" r="6" fill="#10b981"/>
    <text x="300" y="24" fill="#94a3b8" font-family="sans-serif" font-size="12" text-anchor="middle">Library Management System • JavaFX &amp; MySQL</text>

    <!-- Sidebar -->
    <rect x="15" y="52" width="140" height="232" rx="8" fill="#334155"/>
    <rect x="25" y="68" width="120" height="26" rx="4" fill="url(#emerald-grad)"/>
    <text x="85" y="85" fill="#fff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Book Catalog</text>
    <rect x="25" y="105" width="120" height="26" rx="4" fill="#475569"/>
    <text x="85" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Borrowers</text>
    <rect x="25" y="142" width="120" height="26" rx="4" fill="#475569"/>
    <text x="85" y="159" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">Transactions</text>

    <!-- Table content -->
    <rect x="170" y="52" width="415" height="232" rx="8" fill="#0f172a"/>
    <line x1="170" y1="90" x2="585" y2="90" stroke="#334155" stroke-width="1"/>
    <text x="190" y="76" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">ID</text>
    <text x="240" y="76" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Book Title</text>
    <text x="400" y="76" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Author</text>
    <text x="515" y="76" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">Status</text>

    <!-- Row 1 -->
    <text x="190" y="122" fill="#cbd5e1" font-family="sans-serif" font-size="11">#101</text>
    <text x="240" y="122" fill="#fff" font-family="sans-serif" font-size="11">Design Patterns in Java</text>
    <text x="400" y="122" fill="#94a3b8" font-family="sans-serif" font-size="11">GoF</text>
    <rect x="500" y="108" width="65" height="20" rx="4" fill="#065f46"/>
    <text x="532" y="122" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Available</text>

    <!-- Row 2 -->
    <text x="190" y="156" fill="#cbd5e1" font-family="sans-serif" font-size="11">#102</text>
    <text x="240" y="156" fill="#fff" font-family="sans-serif" font-size="11">Computer Networks 6th</text>
    <text x="400" y="156" fill="#94a3b8" font-family="sans-serif" font-size="11">A. Tanenbaum</text>
    <rect x="500" y="142" width="65" height="20" rx="4" fill="#831843"/>
    <text x="532" y="156" fill="#f472b6" font-family="sans-serif" font-size="10" text-anchor="middle">Borrowed</text>

    <!-- Row 3 -->
    <text x="190" y="190" fill="#cbd5e1" font-family="sans-serif" font-size="11">#103</text>
    <text x="240" y="190" fill="#fff" font-family="sans-serif" font-size="11">Clean Code Architecture</text>
    <text x="400" y="190" fill="#94a3b8" font-family="sans-serif" font-size="11">Robert C. Martin</text>
    <rect x="500" y="176" width="65" height="20" rx="4" fill="#065f46"/>
    <text x="532" y="190" fill="#34d399" font-family="sans-serif" font-size="10" text-anchor="middle">Available</text>
  </g>
  <text x="400" y="415" fill="#f8fafc" font-family="Montserrat, sans-serif" font-weight="800" font-size="22" text-anchor="middle" letter-spacing="1.2">LIBRARY MANAGEMENT SYSTEM : JAVAFX &amp; MYSQL OOP</text>
</svg>
